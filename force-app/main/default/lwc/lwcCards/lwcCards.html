<template>
    <lightning-card title="LDS getRecord vs getRecordUi" icon-name="custom:custom63">
        <div class="slds-m-around_medium">
            <lightning-button label="Toggle New Card" slot="actions" onclick={handleClick}>
            </lightning-button>

            <div class="slds-box slds-box_xx-small slds-m-bottom_small">
                <p class="slds-text-heading_medium">This is a LWC Card</p>
                <p>My first LWC Card</p>
            </div>

            <template if:true={showNewCard}>
                <div class="slds-box slds-box_xx-small slds-m-bottom_small">
                    <p class="slds-text-heading_medium">This is a New LWC Card</p>
                    <p>My second LWC Card</p>
                </div>
            </template>

            <!-- Simple output from getRecord -->
            <template if:true={recordName}>k
                <p class="slds-m-top_medium">
                    <b>getRecord → Name: </b>{recordName}
                </p>
            </template>

            <!-- Simple output from getRecordUi -->
            <template if:true={uiLabel}>
                <p>
                    <b>getRecordUi → Object Label: </b>{uiLabel}
                </p>
            </template>
        </div>
    </lightning-card>
</template>
